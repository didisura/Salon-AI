<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ salon.name }} - ቀጠሮ ይያዙ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background:#FFFDF9; font-family:'Noto Sans Ethiopic',sans-serif; min-height:100vh; }
        .wrap { max-width:480px; margin:0 auto; padding:32px 20px; }
        .card-box { background:#fff; border:1px solid #EADCDA; border-radius:20px; padding:28px; }
        .btn-rose { background:#C87A76; color:#fff; border:none; font-weight:600; min-height:44px; border-radius:12px; width:100%; }
        .btn-rose:hover { background:#B56864; color:#fff; }
        .form-control, .form-select { border-radius:10px; border:1px solid #EADCDA; background:#FFFDF9; min-height:44px; }
        .header-spa { text-align:center; margin-bottom:24px; }
        .header-spa i { color:#C87A76; font-size:2rem; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header-spa">
            <i class="fa-solid fa-spa"></i>
            <h3 class="fw-bold mt-2 mb-0">{{ salon.name }}</h3>
            <p class="text-muted small">ቀጠሮዎን በቀላሉ ይያዙ</p>
        </div>

        <div class="card-box">
            {% if success %}
            <div class="alert alert-success d-flex align-items-center gap-2">
                <i class="fa-solid fa-circle-check"></i>
                <div>ቀጠሮዎ ተይዟል! ሳሎኑ ያረጋግጣል።</div>
            </div>
            {% endif %}

            {% if error == 'conflict' %}
            <div class="alert alert-danger d-flex align-items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <div>ይህ ሰዓት ተይዟል፣ እባክዎ ሌላ ሰዓት ይምረጡ።</div>
            </div>
            {% endif %}

            <form action="/book/{{ salon.id }}" method="post">
                <div class="mb-3">
                    <label class="form-label small text-muted fw-semibold">ሙሉ ስም</label>
                    <input type="text" name="customer_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted fw-semibold">ስልክ ቁጥር</label>
                    <input type="tel" name="customer_phone" class="form-control" required placeholder="0911223344">
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted fw-semibold">አገልግሎት</label>
                    <select name="service_id" class="form-select" required>
                        {% for s in services %}
                        <option value="{{ s.id }}">{{ s.name }} ({{ s.price }} ETB)</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted fw-semibold">ባለሙያ</label>
                    <select name="staff_id" class="form-select" required>
                        {% for st in staff_members %}
                        <option value="{{ st.id }}">{{ st.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted fw-semibold">ቀንና ሰዓት</label>
                    <input type="datetime-local" name="appointment_time" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-rose mt-2">
                    <i class="fa-solid fa-calendar-check me-1"></i> ቀጠሮ ያዝ
                </button>
            </form>
        </div>
    </div>
</body>
</html>
