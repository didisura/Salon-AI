<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melkegna - {% if mode == 'login' %}መግቢያ (Login){% else %}መመዝገቢያ (Sign Up){% endif %}</title>
    
    <!-- Bootstrap 5 & FontAwesome & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-cream: #FFFDF9;
            --soft-pink: #F7EBE8;
            --card-pink: #FAF0ED;
            --accent-rose: #C87A76;
            --accent-rose-hover: #B56864;
            --text-dark: #2D2424;
            --text-muted: #7A6E6E;
            --border-soft: #EADCDA;
            --font-main: 'Noto Sans Ethiopic', 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            background: #FFFFFF;
            border-radius: 24px;
            padding: 40px 32px;
            border: 1px solid var(--border-soft);
            box-shadow: 0 12px 32px rgba(200, 122, 118, 0.08);
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo i {
            color: var(--accent-rose);
            font-size: 2.4rem;
            margin-bottom: 8px;
        }

        .brand-logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-dark);
            margin: 0;
        }

        .brand-logo p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .form-control {
            background-color: var(--bg-cream);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .form-control:focus {
            background-color: #FFFFFF;
            border-color: var(--accent-rose);
            box-shadow: 0 0 0 0.25rem rgba(200, 122, 118, 0.15);
        }

        .btn-rose {
            background-color: var(--accent-rose);
            color: #FFFFFF;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            padding: 12px;
            transition: all 0.2s ease;
        }

        .btn-rose:hover {
            background-color: var(--accent-rose-hover);
            color: #FFFFFF;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-toggle a {
            color: var(--accent-rose);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-toggle a:hover {
            text-decoration: underline;
        }

        .alert-soft {
            background-color: var(--soft-pink);
            border: 1px solid var(--border-soft);
            color: var(--accent-rose);
            border-radius: 12px;
            font-size: 0.88rem;
        }

        .input-group-text {
            background-color: var(--bg-cream);
            border-color: var(--border-soft);
            color: var(--text-muted);
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        .has-icon {
            border-top-left-radius: 0 !important;
            border-bottom-left-radius: 0 !important;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="brand-logo">
        <i class="fa-solid fa-spa"></i>
        <h1>መልከኛ (Melkegna)</h1>
        <p>የውበትና ሳሎን ማኔጅመንት ሲስተም</p>
    </div>

    <!-- ERROR DISPLAY -->
    {% if error %}
    <div class="alert alert-soft mb-4 text-center" role="alert">
        <i class="fa-solid fa-circle-info me-1"></i> {{ error }}
    </div>
    {% endif %}

    {% if mode == 'login' %}
    <!-- LOGIN FORM -->
    <form action="/login" method="post">
        <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">ስልክ ቁጥር (Phone Number)</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                <input type="text" name="phone" class="form-control has-icon" placeholder="0911000000" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-muted small fw-semibold">የይለፍ ቃል (Password)</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password" class="form-control has-icon" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-rose w-100 mb-2">ይግቡ (Sign In)</button>
    </form>

    <div class="auth-toggle">
        አዲስ ሳሎን ነዎት? <a href="/signup">አካውንት ይክፈቱ (Sign Up)</a>
    </div>

    {% else %}
    <!-- SIGNUP FORM -->
    <form action="/signup" method="post">
        <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">የሳሎኑ ስም (Salon Name)</label>
            <input type="text" name="salon_name" class="form-control" placeholder="ምሳሌ፡ ሮዝ ቢዩቲ ሳሎን" required>
        </div>

        <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">የባለቤቱ ስም (Owner Name)</label>
            <input type="text" name="owner_name" class="form-control" placeholder="ምሳሌ፡ ሳራ አለሙ" required>
        </div>

        <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">ስልክ ቁጥር (Phone Number)</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                <input type="text" name="phone" class="form-control has-icon" placeholder="0911000000" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-muted small fw-semibold">የይለፍ ቃል (Password)</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password" class="form-control has-icon" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-rose w-100 mb-2">መዝግብ (Create Account)</button>
    </form>

    <div class="auth-toggle">
        ቀደም ሲል አካውንት አለዎት? <a href="/login">ይግቡ (Log In)</a>
    </div>
    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
