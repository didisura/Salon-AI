<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ይመዝገቡ - መልከኛ</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Sans+Ethiopic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2E2013; --muted:#8C7B63; --cream:#F7F1E3; --cream-deep:#EFE3C7;
    --card:#FFFFFF; --line:#E7D9B9; --field:#FBF7EC; --brown:#3B2A1A;
    --brown-dark:#231506; --accent:#A67C43; --accent-dark:#7A5731;
    --danger:#B5473F; --danger-bg:#FBEDEA; --ok:#2F6B34; --ok-dark:#234F27; --ok-bg:#EAF3EA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh; font-family:'Noto Sans Ethiopic',sans-serif; color:var(--ink);
    background:var(--cream); -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
  }
  .eng{font-family:'Fraunces',serif;}
  .phone{width:100%; max-width:420px; min-height:100vh; position:relative; overflow:hidden; background:var(--cream);}
  .header{
    background:linear-gradient(160deg, #3B2A1A 0%, #5C3D22 55%, #A67C43 100%);
    padding:28px 24px 90px; position:relative; color:#fff;
  }
  .back-link{
    position:absolute; top:22px; left:18px; width:36px; height:36px; border-radius:12px;
    background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center;
    color:#fff; text-decoration:none; backdrop-filter:blur(4px);
  }
  .brand{display:flex; flex-direction:column; align-items:center; gap:10px; padding-top:12px;}
  .logo-img{width:68px; height:auto; filter:drop-shadow(0 4px 12px rgba(0,0,0,.25));}
  .wordmark{font-family:'Fraunces',serif; font-weight:600; font-size:1.35rem; letter-spacing:.06em; color:#fff;}
  .tagline{font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; opacity:.75; margin-top:2px;}
  .header-text{text-align:center; margin-top:22px;}
  .eyebrow{font-family:'Fraunces',serif; font-style:italic; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; opacity:.8; margin-bottom:10px;}
  .headline{font-size:1.32rem; font-weight:700; line-height:1.4; margin-bottom:8px;}
  .headline .eng{font-style:italic; font-weight:500; opacity:.9;}
  .sub{font-size:.86rem; line-height:1.65; opacity:.85; max-width:32ch; margin:0 auto;}
  .card{
    background:var(--card); border-radius:28px 28px 0 0; margin-top:-48px;
    padding:32px 24px 40px; position:relative; z-index:2;
    box-shadow:0 -12px 40px rgba(46,32,19,.12); min-height:calc(100vh - 280px);
  }
  .field{margin-bottom:18px;}
  .field.tight{margin-bottom:6px;}
  .field label{display:block; font-size:.78rem; font-weight:600; color:var(--muted); margin-bottom:8px;}
  .input-wrap{
    display:flex; align-items:center; gap:10px; background:var(--field);
    border:1px solid var(--line); border-radius:14px; padding:0 14px; min-height:52px;
    transition:border-color .15s, background .15s;
  }
  .input-wrap:focus-within{border-color:var(--brown); background:#fff;}
  .input-wrap.pw-bad{border-color:var(--danger);}
  .input-wrap.pw-ok{border-color:var(--ok);}
  .input-wrap svg{flex:none; color:var(--muted);}
  .input-wrap input, .input-wrap select{
    flex:1; border:none; outline:none; background:transparent;
    font-size:.96rem; color:var(--ink); padding:14px 0; min-width:0; font-family:inherit;
  }
  .input-wrap input::placeholder{color:#B8AA97;}
  .eye-toggle{flex:none; border:none; background:transparent; color:var(--muted); padding:6px; display:flex; cursor:pointer;}
  .eye-toggle:hover{color:var(--ink);}
  .pw-hint{font-size:.78rem; color:var(--muted); margin:6px 2px 0; min-height:16px;}
  .pw-hint.ok{color:var(--ok);}
  .pw-hint.bad{color:var(--danger);}
  .hours-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .days-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;}
  .day-chip{position:relative; cursor:pointer;}
  .day-chip input{position:absolute; opacity:0; width:0; height:0;}
  .day-chip span{
    display:flex; align-items:center; justify-content:center;
    min-height:40px; border-radius:12px; border:1px solid var(--line);
    background:var(--field); font-size:.8rem; font-weight:600; color:var(--muted);
    transition:all .15s;
  }
  .day-chip input:checked + span{
    background:var(--ok-bg); border-color:var(--ok); color:var(--ok-dark);
  }
  .day-chip:hover span{border-color:var(--brown);}
  .security-note{
    display:flex; align-items:flex-start; gap:10px; background:var(--ok-bg);
    border-radius:14px; padding:13px 14px; margin:20px 0 22px;
  }
  .security-note svg{flex:none; color:var(--ok-dark); margin-top:1px;}
  .security-note p{margin:0; font-size:.82rem; line-height:1.6; color:var(--ok-dark);}
  .btn-primary{
    width:100%; min-height:52px; border:none; border-radius:14px;
    background:var(--ok); color:#fff; font-weight:700; font-size:.98rem;
    letter-spacing:.02em; cursor:pointer; transition:background .15s; font-family:inherit;
  }
  .btn-primary:hover{background:var(--ok-dark);}
  .btn-primary:disabled{background:#C9C1AE; cursor:not-allowed;}
  .alert{border-radius:12px; font-size:.84rem; padding:11px 13px; margin-bottom:18px; line-height:1.5; background:var(--danger-bg); color:var(--danger);}
  .alt-link{text-align:center; font-size:.88rem; color:var(--muted); margin-top:24px;}
  .alt-link a{color:var(--ok-dark); font-weight:700; text-decoration:none; border-bottom:1px solid var(--line);}
  .alt-link a:hover{border-color:var(--ok-dark);}
  .support-line{text-align:center; font-size:.8rem; color:var(--muted); margin-top:16px; padding-bottom:8px;}
  .support-line a{color:var(--accent-dark); font-weight:600; text-decoration:none; margin:0 4px;}
  .support-line a:hover{text-decoration:underline;}
  .privacy-link{text-align:center; font-size:.75rem; margin-top:10px; padding-bottom:24px;}
  .privacy-link a{color:var(--muted); text-decoration:none; font-weight:500;}
  .privacy-link a:hover{color:var(--accent-dark); text-decoration:underline;}
  @media (max-width:380px){
    .header{padding:24px 18px 80px;} .headline{font-size:1.2rem;} .card{padding:28px 18px 36px;}
    .days-grid{grid-template-columns:repeat(3, 1fr);}
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <a href="/login" class="back-link" aria-label="ተመለስ">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <div class="brand">
        <img class="logo-img" src="/static/images/logo.png" onerror="this.style.display='none'" alt="Melkegna Logo">
        <div class="wordmark eng">Melkegna</div>
