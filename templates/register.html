<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ይመዝገቡ - መልከኛ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background:#FFFDF9; font-family:'Noto Sans Ethiopic',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .card-box { background:#fff; border:1px solid #EADCDA; border-radius:20px; padding:32px; width:100%; max-width:420px; }
        .btn-rose { background:#C87A76; color:#fff; border:none; font-weight:600; min-height:44px; border-radius:12px; }
        .btn-rose:hover { background:#B56864; color:#fff; }
        .form-control { border-radius:10px; border:1px solid #EADCDA; background:#FFFDF9; min-height:44px; }
    </style>
</head>
<body>
    <div class="card-box">
        <h3 class="fw-bold text-center mb-1">ሳሎንዎን ይመዝገቡ</h3>
        <p class="text-muted text-center small mb-4">በመልከኛ ላይ አካውንት ይክፈቱ</p>

        {% if error == 'exists' %}
        <div class="alert alert-danger py-2 small">ይህ ስልክ ቁጥር አስቀድሞ ተመዝግቧል።</div>
        {% endif %}
        {% if error == 'invalid_phone' %}
        <div class="alert alert-danger py-2 small">ትክክለኛ የስልክ ቁጥር ያስገቡ (ለምሳሌ፡ 0911223344)።</div>
        {% endif %}

        <form action="/register" method="post">
            <div class="mb-3">
                <label class="form-label small text-muted fw-semibold">የሳሎን ስም</label>
                <input type="text" name="name" class="form-control" required placeholder="ለምሳሌ፡ ሱራ ሳሎን">
            </div>
            <div class="mb-3">
                <label class="form-label small text-muted fw-semibold">የባለቤት ስም</label>
                <input type="text" name="owner_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small text-muted fw-semibold">ስልክ ቁጥር</label>
                <input type="tel" name="phone" class="form-control" required placeholder="09XXXXXXXX" pattern="0[0-9]{9}" inputmode="numeric" autocomplete="tel">
            </div>
            <div class="mb-3">
                <label class="form-label small text-muted fw-semibold">የይለፍ ቃል</label>
                <input type="password" name="password" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn btn-rose w-100 mt-2">ይመዝገቡ</button>
        </form>

        <p class="text-center small text-muted mt-3 mb-0">
            አካውንት አለዎት? <a href="/login" style="color:#C87A76;">ይግቡ</a>
        </p>
    </div>
</body>
</html>
