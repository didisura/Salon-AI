<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melkegna HQ — Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FAFAF8;
            --sidebar-bg: #F3E9DC;
            --card-bg: #FFFFFF;
            --accent: #9C6B3F;
            --accent-hover: #7E5530;
            --text-dark: #2D2424;
            --text-muted: #7A6E6E;
            --border: #E3D3C0;
            --font: 'Noto Sans Ethiopic', 'Plus Jakarta Sans', sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg-cream);
            color: var(--text-dark);
            font-family: var(--font);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
        }
        .logo-mark {
            width: 64px; height: 64px; margin: 0 auto 14px;
            border-radius: 18px; background: #F5EDE3;
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
        }
        .logo-mark i { color: var(--accent); font-size: 1.6rem; }
        h1 {
            font-size: 1.45rem; font-weight: 700; text-align: center;
            color: var(--accent); margin: 0 0 4px;
        }
        .sub {
            text-align: center; color: var(--text-muted);
            font-size: 0.85rem; margin-bottom: 28px;
        }
        .form-label {
            font-size: 0.75rem; font-weight: 700; letter-spacing: 0.6px;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;
        }
        .form-control {
            border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg-cream); padding: 12px 14px; min-height: 46px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 0.2rem rgba(156,107,63,0.12);
            background: #fff;
        }
        .btn-accent {
            background: var(--accent); color: #fff; border: none;
            font-weight: 700; padding: 13px; border-radius: 12px;
            width: 100%; font-size: 0.95rem;
            transition: background 0.15s;
        }
        .btn-accent:hover { background: var(--accent-hover); color: #fff; }
        .alert-soft {
            background: #FFEBEE; border: 1px solid #FFCDD2; color: #C62828;
            border-radius: 12px; padding: 12px 14px; font-size: 0.88rem;
            font-weight: 600; margin-bottom: 20px;
        }
        .back-link {
            display: block; text-align: center; margin-top: 22px;
            color: var(--text-muted); font-size: 0.82rem; text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { color: var(--accent); }
        .divider {
            border: none; border-top: 1px solid var(--border);
            margin: 22px 0 0;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-mark"><i class="fa-solid fa-crown"></i></div>
        <h1>Melkegna HQ</h1>
        <p class="sub">Super Admin authentication</p>

        {% if error %}
        <div class="alert-soft">
            <i class="fa-solid fa-circle-exclamation me-1"></i>
            Invalid admin key. Please try again.
        </div>
        {% endif %}

        <form action="/admin/login" method="post" autocomplete="off">
            <div class="mb-4">
                <label class="form-label" for="key">Admin secret key</label>
                <input
                    type="password"
                    id="key"
                    name="key"
                    required
                    autofocus
                    placeholder="••••••••••••••••"
                    class="form-control"
                >
            </div>
            <button type="submit" class="btn-accent">
                <i class="fa-solid fa-lock me-2"></i> Authenticate
            </button>
        </form>

        <hr class="divider">
        <a href="/login" class="back-link">
            <i class="fa-solid fa-arrow-left me-1"></i> Business portal login
        </a>
    </div>
</body>
</html>
