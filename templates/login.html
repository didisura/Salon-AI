<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ግባ - መልከኛ</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Sans+Ethiopic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2E2013; --muted:#8C7B63; --cream:#F7F1E3; --cream-deep:#EFE3C7;
    --card:#FFFFFF; --line:#E7D9B9; --field:#FBF7EC; --brown:#3B2A1A;
    --brown-dark:#231506; --accent:#A67C43; --accent-dark:#7A5731;
    --danger:#B5473F; --danger-bg:#FBEDEA; --ok:#2F6B34; --ok-bg:#EAF3EA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh; font-family:'Noto Sans Ethiopic',sans-serif; color:var(--ink);
    background:var(--cream); -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
  }
  .eng{font-family:'Fraunces',serif;}
  .phone{width:100%; max-width:420px; min-height:100vh; position:relative; overflow:hidden; background:var(--cream);}
  .header{
    background:linear-gradient(160deg, #3B2A1A 0%, #5C3D22 55%, #A67C43 100%);
    padding:36px 24px 100px; position:relative; color:#fff;
  }
  .brand{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .logo-img{width:72px; height:auto; filter:drop-shadow(0 4px 12px rgba(0,0,0,.25));}
  .wordmark{font-family:'Fraunces',serif; font-weight:600; font-size:1.4rem; letter-spacing:.06em; color:#fff;}
  .brand-am{font-family:'Noto Sans Ethiopic',sans-serif; font-weight:700; font-size:1.15rem; letter-spacing:0; margin-top:2px;}
  .tagline{font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; opacity:.75;}
  .header-text{text-align:center; margin-top:28px;}
  .headline{font-size:1.45rem; font-weight:700; line-height:1.4; margin-bottom:10px;}
  .headline .eng{font-style:italic; font-weight:500; opacity:.9;}
  .sub{font-size:.88rem; line-height:1.65; opacity:.85; max-width:30ch; margin:0 auto;}
  .card{
    background:var(--card); border-radius:28px 28px 0 0; margin-top:-52px;
    padding:36px 24px 48px; position:relative; z-index:2;
    box-shadow:0 -12px 40px rgba(46,32,19,.12); min-height:calc(100vh - 300px);
  }
  .field{margin-bottom:20px;}
  .field label{display:block; font-size:.78rem; font-weight:600; color:var(--muted); margin-bottom:8px;}
  .input-wrap{
    display:flex; align-items:center; gap:10px; background:var(--field);
    border:1px solid var(--line); border-radius:14px; padding:0 14px; min-height:52px;
    transition:border-color .15s, background .15s;
  }
  .input-wrap:focus-within{border-color:var(--brown); background:#fff;}
  .input-wrap svg{flex:none; color:var(--muted);}
  .input-wrap input{
    flex:1; border:none; outline:none; background:transparent;
    font-size:.96rem; color:var(--ink); padding:14px 0; min-width:0; font-family:inherit;
  }
  .input-wrap input::placeholder{color:#B8AA97;}
  .eye-toggle{flex:none; border:none; background:transparent; color:var(--muted); padding:6px; display:flex; cursor:pointer;}
  .eye-toggle:hover{color:var(--ink);}
  .btn-primary{
    width:100%; min-height:52px; border:none; border-radius:14px;
    background:var(--brown); color:#fff; font-weight:700; font-size:.98rem;
    letter-spacing:.02em; cursor:pointer; margin-top:8px; transition:background .15s; font-family:inherit;
  }
  .btn-primary:hover{background:var(--brown-dark);}
  .alert{display:flex; align-items:flex-start; gap:8px; border-radius:12px; font-size:.84rem; padding:11px 13px; margin-bottom:18px; line-height:1.5;}
  .alert-bad{background:var(--danger-bg); color:var(--danger);}
  .alert-ok{background:var(--ok-bg); color:var(--ok);}
  .alt-link{text-align:center; font-size:.88rem; color:var(--muted); margin-top:28px;}
  .alt-link a{color:var(--brown); font-weight:700; text-decoration:none; border-bottom:1px solid var(--line);}
  .alt-link a:hover{border-color:var(--brown);}
  .support-line{text-align:center; font-size:.8rem; color:var(--muted); margin-top:16px; padding-bottom:8px;}
  .support-line a{color:var(--accent-dark); font-weight:600; text-decoration:none; margin:0 4px;}
  .support-line a:hover{text-decoration:underline;}
  .privacy-link{text-align:center; font-size:.75rem; margin-top:10px; padding-bottom:24px;}
  .privacy-link a{color:var(--muted); text-decoration:none; font-weight:500;}
  .privacy-link a:hover{color:var(--accent-dark); text-decoration:underline;}
  
  /* Language toggle — same pattern as dashboard / public booking */
  .lang-toggle {
    position: absolute; top: 18px; right: 16px; z-index: 5;
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35);
    border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 0.78rem;
    color: #fff; cursor: pointer; font-family: inherit;
    backdrop-filter: blur(4px);
  }
  .lang-toggle:hover { background: rgba(255,255,255,0.28); }
  [data-lang-en] { display: none; }
  html[lang="en"] [data-lang-am] { display: none !important; }
  html[lang="en"] [data-lang-en] { display: inline !important; }
  html[lang="am"] [data-lang-am] { display: inline !important; }
  html[lang="am"] [data-lang-en] { display: none !important; }
  /* Block-level bilingual */
  .i18n-block-en { display: none; }
  html[lang="en"] .i18n-block-am { display: none !important; }
  html[lang="en"] .i18n-block-en { display: block !important; }
  html[lang="am"] .i18n-block-am { display: block !important; }
  html[lang="am"] .i18n-block-en { display: none !important; }

  @media (max-width:380px){
    .header{padding:28px 18px 90px;} .headline{font-size:1.28rem;} .card{padding:28px 18px 40px;}
  }
</style>
</head>

      </button>
