<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ግባ - መልከኛ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background:#FFFDF9; font-family:'Noto Sans Ethiopic',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .card-box { background:#fff; border:1px solid #EADCDA; border-radius:20px; padding:32px; width:100%; max-width:400px; }
        .btn-rose { background:#C87A76; color:#fff; border:none; font-weight:600; min-height:44px; border-radius:12px; }
        .btn-rose:hover { background:#B56864; color:#fff; }
        .form-control { border-radius:10px; border:1px solid #EADCDA; background:#FFFDF9; min-height:44px; }
    </style>
</head>
<body>
    <div class="card-box">
        <h3 class="fw-bold text-center mb-1">መልከኛ</h3>
        <p class="text-muted text-center small mb-4">ወደ ሳሎን ዳሽቦርድዎ ይግቡ</p>

        {% if error == 'invalid' %}
        <div class="alert alert-danger py-2 small">ኢሜይል ወይም የይለፍ ቃል ትክክል አይደለም።</div>
        {% endif %}
        {% if registered %}
        <div class="alert alert-success py-2 small">ተመዝግበዋል! አሁን ይግቡ።</div>
        {% endif %}

        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label small text-muted fw-semibold">ኢሜይል</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small text-muted fw-semibold">የይለፍ ቃል</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-rose w-100 mt-2">ግባ</button>
        </form>

        <p class="text-center small text-muted mt-3 mb-0">
            አካውንት የለዎትም? <a href="/register" style="color:#C87A76;">ይመዝገቡ</a>
        </p>
    </div>
</body>
</html>
